name: Deploy to TestFlight

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  testflight:
    name: Build & Upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | tail -n 1)
          if [ -n "$XCODE_PATH" ]; then
            echo "Switching to $XCODE_PATH..."
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          fi
          xcodebuild -version

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pyjwt cryptography requests

      - name: Install npm dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Sync Capacitor iOS
        run: |
          npx cap sync ios

      - name: Configure App Store Connect & Code Signing
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 scripts/setup_signing_and_app.py

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install
          cd ../..

      - name: Build Xcode Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p build
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/Flora.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=${TEAM_ID} \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_UUID}" \
            OTHER_CODE_SIGN_FLAGS="--keychain build.keychain" \
            -destination "generic/platform=iOS"

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Flora.xcarchive \
            -exportPath build/output \
            -exportOptionsPlist ios/App/exportOptions.plist

      - name: Upload IPA to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA_PATH=$(find build/output -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "❌ Error: IPA file not found in build/output"
            ls -la build/output
            exit 1
          fi
          echo "Found IPA: $IPA_PATH"
          echo "Uploading to TestFlight via xcrun altool..."
          set +e
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"
          ALTOOL_EXIT=$?
          set -e
          if [ $ALTOOL_EXIT -eq 0 ]; then
            echo "✅ Successfully uploaded build to TestFlight!"
          else
            echo "⚠️ altool upload exited with code $ALTOOL_EXIT."
            echo "If the error was -19000 (No suitable application records found), make sure to create the App record once in https://appstoreconnect.apple.com/apps with Bundle ID 'com.floraai.plantdoctor'."
            echo "The fully signed IPA is saved in GitHub Artifacts below."
            exit $ALTOOL_EXIT
          fi

      - name: Verify Build in App Store Connect
        if: always()
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          sleep 10
          python3 scripts/check_app_builds.py || true

      - name: Upload IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Flora-AI-TestFlight-IPA
          path: build/output/*.ipa
          if-no-files-found: warn

